name: se_knowledge
description: "SE Knowledge - Standalone Desktop App quan ly ban do tri thuc mon hoc (Obsidian-style) bang Flutter Desktop + SQLite."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- Embedded Database (SQLite thuan, khong can server) ---
  sqflite_common_ffi: ^2.3.3

  # --- Duong dan / thu muc he thong ---
  path: ^1.9.0
  path_provider: ^2.1.4

  # --- Chon thu muc Obsidian Vault ---
  file_selector: ^1.0.3

  # --- Ve do thi tri thuc ---
  graphview: ^1.2.0

  # --- Goi API AI (Gemini / OpenAI) ---
  http: ^1.2.2

  # --- Luu cau hinh cuc bo (API key, duong dan vault) ---
  shared_preferences: ^2.3.2
  flutter_markdown: ^0.7.7+1
  html: ^0.15.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
